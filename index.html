<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>São João Wiki 🌽</title>
    <!-- Google Fonts for premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse para ler o Google Sheets -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        button, select, input { touch-action: manipulation; }
        /* Micro-interactions & animations */
        .show-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .show-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px -6px rgba(234, 88, 12, 0.15);
        }
        .show-card:active {
            transform: scale(0.98);
        }
        /* Custom styled select arrow */
        .custom-select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%23ea580c' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.75rem center;
            background-repeat: no-repeat;
            background-size: 1.25rem;
            padding-right: 2.5rem;
        }
        #date-tabs {
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
        }
        #date-tabs:active {
            cursor: grabbing;
        }
        /* Esconde os cards de anúncios vazios ou bloqueados por padrão */
        .ad-card {
            display: none !important;
        }
        /* Mostra os cards de anúncios apenas se o AdSense os preencher com sucesso */
        .ad-card:has(ins[data-ad-status="filled"]) {
            display: flex !important;
        }
    </style>
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4516975332271687" crossorigin="anonymous"></script>
</head>
<body class="bg-stone-100 md:bg-stone-200/50 text-stone-900 min-h-screen flex justify-center antialiased">

    <!-- Container App Canvas (PC e Mobile) -->
    <div class="w-full max-w-md md:max-w-4xl lg:max-w-5xl bg-stone-50 flex flex-col h-screen md:h-[92vh] md:my-6 md:rounded-3xl md:shadow-2xl md:border md:border-stone-200 overflow-hidden transition-all duration-300">

        <!-- Cabeçalho Fixo com Carrossel de Datas -->
        <header class="bg-gradient-to-br from-amber-500 via-orange-500 to-red-600 text-white shadow-md">
            <div class="px-4 py-4 flex items-center justify-between">
                <div>
                    <h1 class="text-2xl font-black tracking-tight flex items-center gap-1.5 drop-shadow-sm">
                        🌽 São João Wiki 🔥
                    </h1>
                    <p class="text-xs text-amber-100 font-medium tracking-wide uppercase">Programação de Bolso</p>
                </div>
                <div id="badge-total" class="bg-white/20 text-white text-xs font-bold px-3 py-1.5 rounded-full backdrop-blur-md border border-white/10 transition-all duration-300">
                    0 shows
                </div>
            </div>

            <!-- Filtros por Data (Carrossel Horizontal) -->
            <div class="bg-orange-900/20 border-t border-white/10 px-4 py-2.5">
                <div id="date-tabs" class="flex gap-2 overflow-x-auto no-scrollbar py-0.5">
                    <button onclick="selectDateTab('', this)" class="date-tab bg-white text-orange-900 text-xs font-bold px-4 py-2 rounded-full shadow-sm shrink-0 transition-all">
                        📅 Todos os Dias
                    </button>
                </div>
            </div>
        </header>

        <!-- Filtros Secundários na Vertical / Horizontal no Desktop -->
        <section class="bg-white border-b border-stone-200/80 p-4 shadow-sm flex flex-col md:flex-row gap-3">
            <!-- Filtro de Local -->
            <div class="relative flex-1">
                <label for="filter-location" class="block text-[10px] font-bold text-stone-500 uppercase tracking-wider mb-1">📍 Filtrar por Local</label>
                <select id="filter-location" onchange="filterDataMobile()" class="custom-select w-full bg-stone-50 border border-stone-200/70 rounded-xl p-2.5 text-xs font-semibold text-stone-700 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 focus:bg-white focus:outline-none appearance-none cursor-pointer transition-all">
                    <option value="">Todos os locais</option>
                </select>
            </div>

            <!-- Busca de Banda -->
            <div class="relative flex-1">
                <label for="search-band" class="block text-[10px] font-bold text-stone-500 uppercase tracking-wider mb-1">🔍 Buscar Artista / Banda</label>
                <input type="text" id="search-band" oninput="filterDataMobile()" placeholder="Procurar banda ou artista..." 
                       class="w-full bg-stone-50 border border-stone-200/70 rounded-xl p-2.5 text-xs font-medium text-stone-700 placeholder-stone-400 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 focus:bg-white focus:outline-none transition-all">
            </div>
        </section>

        <!-- Conteúdo Principal -->
        <main class="flex-1 px-4 py-5 overflow-y-auto bg-stone-50/50">
            

            
            <!-- Estado de Carregamento -->
            <div id="loading" class="text-center py-20 text-stone-400 font-medium">
                <div class="animate-spin inline-block w-8 h-8 border-3 border-orange-500 border-t-transparent rounded-full mb-3"></div>
                <p class="text-xs tracking-wide">Carregando dados...</p>
            </div>

            <!-- Lista de Cards (Feed de Conteúdo) -->
            <div id="cards-container" class="hidden pb-8">
                <!-- Inserido via JS -->
            </div>

            <!-- Estado Vazio / Erro -->
            <div id="empty-state" class="hidden text-center py-20 px-4">
                <span class="text-5xl animate-pulse inline-block mb-2">🌵</span>
                <h3 class="text-sm font-bold text-stone-700">Nenhum show encontrado</h3>
                <p class="text-xs text-stone-400 mt-1.5 max-w-[250px] mx-auto leading-relaxed">Tente alterar os filtros ou adicione shows no banco de dados SQLite.</p>
            </div>
        </main>

        <!-- Barra de Ações Inferior Fixa para Exportar -->
        <div id="action-bar" class="bg-white border-t border-stone-200 p-4 shadow-lg flex justify-between items-center hidden">
            <div class="flex items-center gap-3">
                <span class="text-sm font-semibold text-stone-600">
                    <span id="selected-count" class="bg-orange-100 text-orange-800 text-xs font-black px-2.5 py-1 rounded-full mr-1">0</span> selecionados
                </span>
                <button onclick="clearSelection()" class="text-xs text-stone-400 hover:text-red-500 font-bold transition-colors">
                    Limpar
                </button>
            </div>
            <button onclick="exportSelectedShows()" class="bg-gradient-to-r from-orange-500 via-orange-600 to-red-600 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow-md hover:scale-[1.02] active:scale-[0.98] transition-all">
                📋 Copiar JSON
            </button>
        </div>

    </div>

    <script>
        let allShows = [];
        let activeDateFilter = "";

        document.addEventListener("DOMContentLoaded", () => {
            // Consome dados diretamente do banco SQLite através da nossa API local
            // Suporta abertura via http://localhost:8080 ou clique duplo direto no arquivo index.html (file://)
            const apiUri = window.location.protocol === 'file:' 
                ? 'http://localhost:8080/api/shows' 
                : '/api/shows';

            fetch(apiUri)
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        console.error("Erro na API de banco de dados:", data.error);
                        showEmptyState();
                        return;
                    }
                    processDatabaseData(data);
                })
                .catch(err => {
                    console.error("Erro ao conectar com o banco SQLite:", err);
                    showEmptyState();
                });

            // Implementação de arrastar carrossel com o mouse (Drag-to-Scroll)
            const slider = document.getElementById('date-tabs');
            let isDown = false;
            let startX;
            let scrollLeft;
            let moved = false;

            slider.addEventListener('mousedown', (e) => {
                isDown = true;
                startX = e.pageX - slider.offsetLeft;
                scrollLeft = slider.scrollLeft;
                moved = false;
            });
            slider.addEventListener('mouseleave', () => {
                isDown = false;
            });
            slider.addEventListener('mouseup', () => {
                isDown = false;
            });
            slider.addEventListener('mousemove', (e) => {
                if(!isDown) return;
                e.preventDefault();
                const x = e.pageX - slider.offsetLeft;
                const walk = (x - startX) * 2; // Velocidade de scroll
                if (Math.abs(x - startX) > 5) {
                    moved = true;
                }
                slider.scrollLeft = scrollLeft - walk;
            });

            // Evita clique acidental nos botões do carrossel ao arrastar
            slider.addEventListener('click', (e) => {
                if (moved) {
                    e.preventDefault();
                    e.stopPropagation();
                }
            }, true);
        });

        // Processa os dados limpos recebidos da API SQLite
        function processDatabaseData(data) {
            allShows = data.filter(show => show["Banda/Artista"]);

            if (allShows.length === 0) {
                showEmptyState();
                return;
            }

            document.getElementById("loading").classList.add("hidden");
            document.getElementById("cards-container").classList.remove("hidden");
            
            buildMobileDateTabs(allShows);
            populateMobileLocations(allShows);
            filterDataMobile();
        }

        function showEmptyState() {
            document.getElementById("loading").classList.add("hidden");
            document.getElementById("cards-container").classList.add("hidden");
            document.getElementById("empty-state").classList.remove("hidden");
        }

        function buildMobileDateTabs(data) {
            const dates = [...new Set(data.map(item => item["Data"]))].filter(Boolean).sort();
            const container = document.getElementById("date-tabs");
            
            // Limpa exceto o primeiro botão (Todos os Dias)
            container.innerHTML = `
                <button onclick="selectDateTab('', this)" class="date-tab bg-white text-orange-900 text-xs font-bold px-4 py-2 rounded-full shadow-sm shrink-0 transition-all">
                    📅 Todos os Dias
                </button>
            `;
            
            dates.forEach(d => {
                const parts = d.split("-");
                const labelFormatado = parts.length === 3 ? `${parts[2]}/${parts[1]}` : d;
                container.innerHTML += `
                    <button onclick="selectDateTab('${d}', this)" class="date-tab bg-orange-950/40 text-orange-100 text-xs font-bold px-4 py-2 rounded-full shrink-0 transition-all">
                        ${labelFormatado}
                    </button>
                `;
            });
        }

        function selectDateTab(dateStr, buttonEl) {
            activeDateFilter = dateStr;
            document.querySelectorAll('.date-tab').forEach(btn => {
                btn.classList.remove('bg-white', 'text-orange-900', 'shadow-sm');
                btn.classList.add('bg-orange-950/40', 'text-orange-100');
            });
            buttonEl.classList.remove('bg-orange-950/40', 'text-orange-100');
            buttonEl.classList.add('bg-white', 'text-orange-900', 'shadow-sm');
            filterDataMobile();
        }

        function populateMobileLocations(data) {
            const locations = [...new Set(data.map(item => item["Local"]))].filter(Boolean).sort();
            const select = document.getElementById("filter-location");
            
            // Limpa as opções anteriores exceto a primeira
            select.innerHTML = '<option value="">📍 Todos os locais</option>';
            
            locations.forEach(l => {
                select.innerHTML += `<option value="${l}">${l}</option>`;
            });
        }

        function filterDataMobile() {
            const selectedLoc = document.getElementById("filter-location").value;
            const searchText = document.getElementById("search-band").value.toLowerCase();

            const filtered = allShows.filter(show => {
                const matchDate = !activeDateFilter || show["Data"] === activeDateFilter;
                const matchLoc = !selectedLoc || show["Local"] === selectedLoc;
                const matchSearch = !searchText || (show["Banda/Artista"] || "").toLowerCase().includes(searchText);
                return matchDate && matchLoc && matchSearch;
            });

            renderMobileCards(filtered);
        }

        let selectedShows = {};

        function toggleShowSelection(showId, banda, local, dataCard, originalData, checkboxEl) {
            if (checkboxEl.checked) {
                selectedShows[showId] = {
                    "Banda/Artista": banda,
                    "Local": local,
                    "DataCard": dataCard,
                    "DataOriginal": originalData
                };
            } else {
                delete selectedShows[showId];
            }
            updateActionBar();
        }

        function updateActionBar() {
            const keys = Object.keys(selectedShows);
            const count = keys.length;
            const actionBar = document.getElementById("action-bar");
            const countBadge = document.getElementById("selected-count");
            
            if (countBadge) countBadge.innerText = count;
            
            if (actionBar) {
                if (count > 0) {
                    actionBar.classList.remove("hidden");
                } else {
                    actionBar.classList.add("hidden");
                }
            }
        }

        function clearSelection() {
            selectedShows = {};
            document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                cb.checked = false;
            });
            updateActionBar();
        }

        function exportSelectedShows() {
            const showsArray = Object.values(selectedShows);
            if (showsArray.length === 0) return;
            
            // Ordena os shows pela data original
            showsArray.sort((a, b) => {
                if (a.DataOriginal < b.DataOriginal) return -1;
                if (a.DataOriginal > b.DataOriginal) return 1;
                return 0;
            });
            
            // Agrupa os shows por dia no formato desejado
            const grouped = {};
            showsArray.forEach(show => {
                const key = `dia ${show.DataCard}`;
                if (!grouped[key]) {
                    grouped[key] = [];
                }
                grouped[key].push({
                    "atração": show["Banda/Artista"],
                    "local": show["Local"]
                });
            });
            
            try {
                const jsonString = JSON.stringify(grouped, null, 2);
                navigator.clipboard.writeText(jsonString)
                    .then(() => {
                        alert("Sucesso! JSON copiado para a área de transferência.");
                    })
                    .catch(err => {
                        console.error("Erro ao copiar para clipboard:", err);
                        alert("Erro ao copiar JSON. Verifique as permissões do seu navegador.");
                    });
            } catch (err) {
                console.error("Erro ao gerar JSON no front-end:", err);
                alert("Erro ao exportar JSON.");
            }
        }

        function renderMobileCards(shows) {
            const container = document.getElementById("cards-container");
            const emptyState = document.getElementById("empty-state");
            
            container.innerHTML = "";
            document.getElementById("badge-total").innerText = `${shows.length} show${shows.length !== 1 ? 's' : ''}`;

            if (shows.length === 0) {
                emptyState.classList.remove("hidden");
                return;
            }
            emptyState.classList.add("hidden");

            let currentHTML = '<ul class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 pb-4">';
            
            shows.forEach((show, index) => {
                const banda = show["Banda/Artista"];
                const local = show["Local"] || "Local a definir";
                const hora = show["Horário"];

                let dataCard = "";
                if(show["Data"]) {
                    const parts = show["Data"].split("-");
                    dataCard = parts.length === 3 ? `${parts[2]}/${parts[1]}` : show["Data"];
                }

                const horaHTML = hora ? `
                            <p class="text-xs text-stone-500 font-medium flex items-center gap-1.5">
                                <span class="text-orange-500">🕒</span> ${hora}
                            </p>
                ` : '';

                const showId = encodeURIComponent(banda + '_' + local + '_' + dataCard);
                const isChecked = selectedShows[showId] ? 'checked' : '';

                currentHTML += `
                    <li class="show-card bg-white rounded-2xl p-4 shadow-sm border border-stone-200/50 flex items-stretch justify-between gap-4">
                        <!-- Checkbox de Seleção -->
                        <div class="flex items-center justify-center shrink-0 pr-1">
                            <input type="checkbox" onchange="toggleShowSelection('${showId}', '${banda.replace(/'/g, "\\'")}', '${local.replace(/'/g, "\\'")}', '${dataCard}', '${show["Data"] || ''}', this)" ${isChecked} class="w-4.5 h-4.5 rounded text-orange-600 focus:ring-orange-500 border-stone-300 transition-all cursor-pointer">
                        </div>

                        <!-- Lado Esquerdo: Nome acima do Local -->
                        <div class="flex flex-col justify-center gap-1.5 items-start text-left min-w-0 flex-1">
                            <h2 class="text-base font-bold text-stone-900 leading-snug tracking-tight">${banda}</h2>
                            <div class="flex flex-col gap-1">
                                <p class="text-xs text-stone-600 font-medium flex items-center gap-1">
                                    <span class="text-amber-500">📍</span> ${local}
                                </p>
                                ${horaHTML}
                            </div>
                        </div>
                        
                        <!-- Lado Direito: Data ocupando a altura total e centralizada -->
                        <div class="flex items-center justify-center shrink-0 pl-3 border-l border-stone-100">
                            <span class="bg-orange-50 text-orange-700 px-3.5 py-2.5 rounded-xl text-xs font-bold border border-orange-100/80 tracking-wide shrink-0">
                                📅 ${dataCard}
                            </span>
                        </div>
                    </li>
                `;

                // A cada 6 cards, fecha o grid, insere o anúncio e abre um novo grid
                if ((index + 1) % 6 === 0 && index !== shows.length - 1) {
                    currentHTML += `</ul>`;
                    currentHTML += `
                        <div class="ad-card my-4 flex justify-center w-full bg-white rounded-2xl p-4 shadow-sm border border-stone-200/50 overflow-hidden min-h-[96px]">
                            <ins class="adsbygoogle"
                                 style="display:inline-block; width:100%; height:90px;"
                                 data-ad-client="ca-pub-4516975332271687"
                                 data-ad-slot="1302805548"
                                 data-full-width-responsive="false"></ins>
                        </div>
                    `;
                    currentHTML += `<ul class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 pb-4">`;
                    
                    setTimeout(() => {
                        try {
                            (window.adsbygoogle = window.adsbygoogle || []).push({});
                        } catch (e) {
                            console.error("AdSense push error (mid-feed):", e);
                        }
                    }, 150);
                }
            });

            currentHTML += `</ul>`;

            // Insere o anúncio final
            currentHTML += `
                <div class="ad-card mt-4 flex justify-center w-full bg-white rounded-2xl p-4 shadow-sm border border-stone-200/50 overflow-hidden min-h-[96px]">
                    <ins class="adsbygoogle"
                         style="display:inline-block; width:100%; height:90px;"
                         data-ad-client="ca-pub-4516975332271687"
                         data-ad-slot="1302805548"
                         data-full-width-responsive="false"></ins>
                </div>
            `;
            setTimeout(() => {
                try {
                    (window.adsbygoogle = window.adsbygoogle || []).push({});
                } catch (e) {
                    console.error("AdSense push error (end-feed):", e);
                }
            }, 150);

            container.innerHTML = currentHTML;
        }
    </script>
</body>
</html>
